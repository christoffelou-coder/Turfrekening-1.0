{% extends "base.html" %}
{% block title %}Inloggen · Turfrekening{% endblock %}
{% block content %}
<div class="page" style="max-width:420px; padding-top:var(--space-6);">
  <h1 style="margin-bottom:var(--space-4);">Admin inloggen</h1>
  <form method="POST" class="card stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Wachtwoord</span><input type="password" name="password" autofocus required class="input"></label>
    <button class="btn btn-primary" style="width:100%">Inloggen</button>
  </form>
</div>
{% endblock %}
