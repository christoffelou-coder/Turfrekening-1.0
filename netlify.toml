[build]
  command = "pip install -t netlify/functions/app/vendor -r requirements.txt"
  functions = "netlify/functions"
  publish = "_site"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = ["app.py", "models.py", "calculations.py", "sheets_sync.py", "templates/**", "static/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
