<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turfrekening</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-overflow-scrolling: touch; }

    .product-btn {
      flex-shrink: 0;
      width: calc((100vw - 1.5rem) / 6);
      border-radius: 0.875rem;
      padding: 0.6rem 0.3rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.08s, border-color 0.1s, background 0.1s;
      border: 2px solid #374151;
      background: #1f2937;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }
    .product-btn:active { transform: scale(0.92); }
    .product-btn.selected { border-color: #f59e0b; background: #292929; }
    .product-emoji { font-size: 2rem; line-height: 1; }
    .product-name  { font-size: 1rem; font-weight: 600; color: #e5e7eb; margin-top: 0.25rem; }

    .user-card {
      border-radius: 0.875rem;
      padding: 0.7rem 0.4rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.08s, background 0.1s;
      border: 2px solid transparent;
      background: #1f2937;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }
    .user-card:active { transform: scale(0.93); }
    .user-card.subtract-mode { border-color: #ef4444 !important; }
    .user-name    { font-size: 1.1rem; font-weight: 600; color: #f3f4f6; }
    .user-count   { font-size: 1.5rem; font-weight: 700; color: #f59e0b; line-height: 1; margin-top: 0.2rem; }
    .user-balance { font-size: 0.8rem; margin-top: 0.2rem; }
    .balance-pos  { color: #4ade80; }
    .balance-neg  { color: #f87171; }

    #subtractBtn.active { background: #ef4444 !important; border-color: #ef4444 !important; color: white !important; }

    #toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(5rem);
      background: #111827; border: 2px solid #374151; border-radius: 1rem;
      padding: 0.7rem 1.6rem;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0; z-index: 100; white-space: nowrap;
      font-size: 1rem; font-weight: 600; color: #f3f4f6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    .shake { animation: shake 0.3s ease; }

    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }

    #loadingScreen {
      position: fixed; inset: 0; background: #030712;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; z-index: 999;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #374151;
      border-top-color: #f59e0b; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <span style="color:#6b7280; font-size:0.9rem;">Laden...</span>
</div>

<div id="app" style="height:100vh; display:flex; flex-direction:column; overflow:hidden; display:none;">

  <!-- Header -->
  <header style="display:flex; align-items:center; justify-content:space-between; padding:0.65rem 1rem; background:#111827; border-bottom:1px solid #1f2937; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <span style="color:#f59e0b; font-weight:700; font-size:1.2rem;">🍺 Turfrekening</span>
      <span id="periodName" style="color:#6b7280; font-size:0.85rem;"></span>
    </div>
    <div style="display:flex; gap:0.5rem; align-items:center;">
      <button id="subtractBtn" onclick="toggleSubtract()"
        style="padding:0.5rem 1rem; background:#1f2937; border:2px solid #374151; border-radius:0.6rem; color:#d1d5db; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.15s;">
        − Correctie
      </button>
    </div>
  </header>

  <!-- Geen actieve periode -->
  <div id="noPeriod" style="flex:1; display:none; align-items:center; justify-content:center;">
    <div style="text-align:center; color:#6b7280;">
      <p style="font-size:1.4rem; margin-bottom:0.5rem;">Geen actieve periode</p>
      <p style="font-size:0.9rem;">Maak een periode aan via de Flask admin.</p>
    </div>
  </div>

  <!-- Hoofd content -->
  <div id="mainContent" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">

    <!-- Producten -->
    <div style="flex-shrink:0; padding:0.75rem 0.75rem 0.6rem; border-bottom:1px solid #1f2937;">
      <p style="color:#6b7280; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.5rem;">Welk product?</p>
      <div class="scroll-x" id="productsRow" style="display:flex; gap:0.5rem; padding-bottom:2px;"></div>
    </div>

    <!-- Status balk -->
    <div style="flex-shrink:0; padding:0.4rem 0.75rem; background:#111827; border-bottom:1px solid #1f2937; display:flex; align-items:center; gap:0.5rem;">
      <p id="selectedLabel" style="color:#6b7280; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; margin:0;">
        Selecteer eerst een product hierboven
      </p>
      <span id="subtractLabel" style="display:none; background:#ef4444; color:white; font-size:0.68rem; padding:0.15rem 0.5rem; border-radius:0.4rem; font-weight:600;">CORRECTIE</span>
    </div>

    <!-- Personen grid -->
    <div class="scroll-x" style="flex:1; padding:0.75rem; display:flex; align-items:stretch;">
      <div id="usersGrid" style="
        display:grid;
        grid-template-rows: repeat(4, 1fr);
        grid-auto-flow: column;
        grid-auto-columns: calc((100vw - 2rem) / 3 - 0.35rem);
        gap: 0.5rem;
        min-width: max-content;
        flex: 1;
      "></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
  const SUPABASE_URL = 'https://nwwjafmeiszdthzzdmep.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_EDUH5o7akxDWxsPREydAEQ_6RwHk_aK'
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  let currentPeriod = null
  let allUsers = []
  let allProducts = []
  let allTallies = []
  let allPayments = []
  let allCorrections = []
  let allHoEvents = []
  let allHoShares = []

  let selectedProductId = null
  let selectedProductName = null
  let selectedProductEmoji = null
  let subtractMode = false

  // ── Data laden ──────────────────────────────────────────────────────────────

  async function loadAll() {
    try {
      const [
        { data: periods },
        { data: users },
        { data: products },
      ] = await Promise.all([
        sb.from('periods').select('*').eq('is_active', true).order('id', { ascending: false }).limit(1),
        sb.from('users').select('*').eq('is_active', true).order('sort_order').order('name'),
        sb.from('products').select('*').eq('is_active', true).order('sort_order'),
      ])

      allUsers = users || []
      allProducts = products || []

      if (!periods || periods.length === 0) {
        document.getElementById('noPeriod').style.display = 'flex'
        document.getElementById('mainContent').style.display = 'none'
        showApp()
        return
      }

      currentPeriod = periods[0]
      document.getElementById('periodName').textContent = currentPeriod.name

      await loadPeriodData()
      renderProducts()
      renderUsers()
      showApp()

    } catch (e) {
      console.error(e)
      showToast('❌ Fout bij laden: ' + e.message, 4000, '#ef4444')
      showApp()
    }
  }

  async function loadPeriodData() {
    const pid = currentPeriod.id
    const [
      { data: tallies },
      { data: payments },
      { data: corrections },
      { data: hoEvents },
      { data: hoShares },
    ] = await Promise.all([
      sb.from('tallies').select('*, products(price)').eq('period_id', pid),
      sb.from('payments').select('*').eq('period_id', pid),
      sb.from('corrections').select('*').eq('period_id', pid),
      sb.from('ho_events').select('*').eq('period_id', pid),
      sb.from('ho_event_shares').select('*'),
    ])

    allTallies = tallies || []
    allPayments = payments || []
    allCorrections = corrections || []
    allHoEvents = hoEvents || []
    allHoShares = hoShares || []
  }

  // ── Berekeningen ─────────────────────────────────────────────────────────────

  function calcStand(user) {
    const nActive = allUsers.length

    // Geturfd
    const geturfd = allTallies
      .filter(t => t.user_id === user.id)
      .reduce((s, t) => s + t.quantity * (t.products?.price || 0), 0)

    // Overgemaakt
    const overgemaakt = allPayments
      .filter(p => p.user_id === user.id)
      .reduce((s, p) => s + p.amount, 0)

    // Correcties
    const correctie = allCorrections
      .filter(c => c.user_id === user.id)
      .reduce((s, c) => s + c.amount, 0)

    // HO aandeel
    let ho = 0
    for (const ev of allHoEvents) {
      if (ev.distribution_type === 'equal_all') {
        ho += nActive > 0 ? ev.total_cost / nActive : 0
      } else if (ev.distribution_type === 'equal_selected') {
        const participants = allHoShares.filter(s => s.ho_event_id === ev.id)
        const isIn = participants.some(s => s.user_id === user.id)
        if (isIn) ho += participants.length > 0 ? ev.total_cost / participants.length : 0
      } else if (ev.distribution_type === 'manual') {
        const share = allHoShares.find(s => s.ho_event_id === ev.id && s.user_id === user.id)
        if (share) ho += share.amount
      }
    }

    return user.previous_balance + overgemaakt - geturfd - ho + correctie
  }

  function countForProduct(userId, productId) {
    return allTallies
      .filter(t => t.user_id === userId && t.product_id === productId)
      .reduce((s, t) => s + t.quantity, 0)
  }

  // ── Renderen ─────────────────────────────────────────────────────────────────

  function renderProducts() {
    const row = document.getElementById('productsRow')
    row.innerHTML = allProducts.map(p => {
      const img = p.image_url
        ? `<img src="${p.image_url}" alt="${esc(p.name)}" style="width:3.5rem;height:3.5rem;object-fit:contain;border-radius:0.5rem;" />`
        : `<div class="product-emoji">${p.emoji}</div>`
      return `
        <div class="product-btn" id="product-${p.id}"
             onclick="selectProduct(${p.id}, '${esc(p.name)}', '${p.emoji}')">
          ${img}
          <div class="product-name">${esc(p.name)}</div>
        </div>
      `
    }).join('')
  }

  function renderUsers() {
    const grid = document.getElementById('usersGrid')
    grid.innerHTML = allUsers.map(u => {
      const stand = calcStand(u)
      return `
        <div class="user-card" id="user-${u.id}"
             onclick="handleUserClick(${u.id}, '${esc(u.name)}')">
          <div class="user-name">${esc(u.name)}</div>
          <div class="user-count" id="count-${u.id}" style="display:none;">0</div>
        </div>
      `
    }).join('')
  }

  function updateUserCard(userId) {
    const user = allUsers.find(u => u.id === userId)
    if (!user) return

    if (selectedProductId) {
      const cnt = countForProduct(userId, selectedProductId)
      const countEl = document.getElementById('count-' + userId)
      if (countEl) {
        countEl.textContent = cnt
        countEl.style.display = cnt > 0 ? 'block' : 'none'
      }
    }
  }

  // ── Interactie ───────────────────────────────────────────────────────────────

  function selectProduct(id, name, emoji) {
    document.querySelectorAll('.product-btn').forEach(el => el.classList.remove('selected'))
    selectedProductId = id
    selectedProductName = name
    selectedProductEmoji = emoji
    const btn = document.getElementById('product-' + id)
    if (btn) btn.classList.add('selected')

    const label = document.getElementById('selectedLabel')
    label.textContent = emoji + ' ' + name + ' — tik op een persoon:'
    label.style.color = '#f3f4f6'

    // Toon turfcounts
    document.querySelectorAll('.user-card').forEach(card => {
      const uid = parseInt(card.id.replace('user-', ''))
      const countEl = document.getElementById('count-' + uid)
      const balEl   = document.getElementById('balance-' + uid)
      const cnt = countForProduct(uid, id)
      if (countEl) { countEl.textContent = cnt; countEl.style.display = cnt > 0 ? 'block' : 'none' }
    })
  }

  function toggleSubtract() {
    subtractMode = !subtractMode
    const btn = document.getElementById('subtractBtn')
    const lbl = document.getElementById('subtractLabel')
    btn.classList.toggle('active', subtractMode)
    lbl.style.display = subtractMode ? 'inline' : 'none'
    document.querySelectorAll('.user-card').forEach(el => el.classList.toggle('subtract-mode', subtractMode))
  }

  function handleUserClick(userId, userName) {
    if (!selectedProductId) {
      showToast('⚠️ Selecteer eerst een product!')
      const row = document.getElementById('productsRow')
      row.classList.add('shake')
      setTimeout(() => row.classList.remove('shake'), 400)
      return
    }
    const qty = subtractMode ? -1 : 1
    addTally(userId, userName, qty)
  }

  async function addTally(userId, userName, qty) {
    try {
      const { data, error } = await sb.from('tallies').insert({
        period_id: currentPeriod.id,
        user_id: userId,
        product_id: selectedProductId,
        quantity: qty,
      }).select('*, products(price)').single()

      if (error) throw error

      allTallies.push(data)
      updateUserCard(userId)

      if (qty < 0) {
        showToast(`↩ Gecorrigeerd: ${userName} — ${selectedProductEmoji} ${selectedProductName}`, 2500, '#ef4444')
      } else {
        showToast(`✓ Aangeslagen: ${userName} — ${selectedProductEmoji} ${selectedProductName}`, 2500, '#16a34a')
      }
    } catch (e) {
      showToast('❌ Fout: ' + e.message, 3000, '#ef4444')
    }
  }

  async function syncSheets() {
    showToast('🔄 Sync gestart...', 2000)
    try {
      const res = await fetch('/.netlify/functions/sync', { method: 'POST' })
      const data = await res.json()
      if (data.ok) showToast('✅ Sheets gesynchroniseerd!', 3000, '#16a34a')
      else showToast('❌ Sync fout: ' + (data.error || 'onbekend'), 4000, '#ef4444')
    } catch {
      showToast('❌ Sync niet beschikbaar', 3000, '#ef4444')
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────

  function showApp() {
    document.getElementById('loadingScreen').style.display = 'none'
    document.getElementById('app').style.display = 'flex'
  }

  function showToast(msg, duration = 2000, color = null) {
    const toast = document.getElementById('toast')
    toast.textContent = msg
    toast.style.borderColor = color || '#374151'
    toast.style.color = color ? color : '#f3f4f6'
    toast.classList.add('show')
    clearTimeout(toast._timer)
    toast._timer = setTimeout(() => toast.classList.remove('show'), duration)
  }

  function esc(str) {
    return String(str).replace(/'/g, "\\'").replace(/</g, '&lt;')
  }

  // Start
  loadAll()
</script>
</body>
</html>
